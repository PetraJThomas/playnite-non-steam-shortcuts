on:
  release:
    types: [published]

name: Attach the .pext to the release

permissions:
  contents: write

jobs:
  build:
    name: Build and upload the .pext
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the tag matches extension.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(grep -E '^Version:' extension.yaml | awk '{print $2}')
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and extension.yaml Version $MANIFEST disagree."
            echo "Playnite shows the manifest version, so a mismatch means the"
            echo "released file reports a different version from the download."
            exit 1
          fi

      - name: Create the pext
        run: |
          # A .pext is a zip with extension.yaml at its root. export-ignore in
          # .gitattributes keeps the repo furniture out of it.
          git archive --format=zip --worktree-attributes \
            -o "playnite-non-steam-shortcuts-${GITHUB_REF_NAME}.pext" \
            "${GITHUB_REF_NAME}"
          unzip -l "playnite-non-steam-shortcuts-${GITHUB_REF_NAME}.pext"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "playnite-non-steam-shortcuts-${GITHUB_REF_NAME}.pext" --clobber
